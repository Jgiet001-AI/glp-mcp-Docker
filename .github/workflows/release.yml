# =============================================================================
# HPE GreenLake MCP Docker - Release Workflow
# =============================================================================
# Creates GitHub releases and optionally pushes to container registry
#
# Triggers:
#   - Push of version tags (v*)
#   - Manual dispatch
# =============================================================================

name: Release

on:
    push:
        tags:
            - "v*"
    workflow_dispatch:
        inputs:
            version:
                description: "Release version (e.g., v1.0.0)"
                required: true
                type: string

permissions:
    contents: write
    packages: write

env:
    REGISTRY: ghcr.io
    IMAGE_PREFIX: ${{ github.repository_owner }}/glp-mcp

jobs:
    # ---------------------------------------------------------------------------
    # Build and Push Container Images
    # ---------------------------------------------------------------------------
    release:
        name: Release ${{ matrix.service }}
        runs-on: ubuntu-latest
        strategy:
            fail-fast: false
            matrix:
                service:
                    - audit-logs
                    - devices
                    - subscriptions
                    - users
                    - workspaces

        steps:
            - name: Checkout
              uses: actions/checkout@v4

            - name: Set version
              id: version
              run: |
                  if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
                    echo "version=${{ inputs.version }}" >> $GITHUB_OUTPUT
                  else
                    echo "version=${GITHUB_REF#refs/tags/}" >> $GITHUB_OUTPUT
                  fi

            - name: Set up Docker Buildx
              uses: docker/setup-buildx-action@v3

            - name: Log in to GitHub Container Registry
              uses: docker/login-action@v3
              with:
                  registry: ${{ env.REGISTRY }}
                  username: ${{ github.actor }}
                  password: ${{ secrets.GITHUB_TOKEN }}

            - name: Extract metadata
              id: meta
              uses: docker/metadata-action@v5
              with:
                  images: ${{ env.REGISTRY }}/${{ env.IMAGE_PREFIX }}-${{ matrix.service }}
                  tags: |
                      type=semver,pattern={{version}}
                      type=semver,pattern={{major}}.{{minor}}
                      type=sha,prefix=
                      type=raw,value=latest,enable=${{ github.ref == format('refs/tags/{0}', steps.version.outputs.version) }}

            - name: Build and push
              uses: docker/build-push-action@v5
              with:
                  context: ./src/${{ matrix.service }}
                  push: true
                  tags: ${{ steps.meta.outputs.tags }}
                  labels: ${{ steps.meta.outputs.labels }}
                  cache-from: type=gha
                  cache-to: type=gha,mode=max
                  platforms: linux/amd64,linux/arm64

    # ---------------------------------------------------------------------------
    # Create GitHub Release
    # ---------------------------------------------------------------------------
    create-release:
        name: Create GitHub Release
        runs-on: ubuntu-latest
        needs: release

        steps:
            - name: Checkout
              uses: actions/checkout@v4
              with:
                  fetch-depth: 0

            - name: Set version
              id: version
              run: |
                  if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
                    echo "version=${{ inputs.version }}" >> $GITHUB_OUTPUT
                  else
                    echo "version=${GITHUB_REF#refs/tags/}" >> $GITHUB_OUTPUT
                  fi

            - name: Generate changelog
              id: changelog
              run: |
                  # Get previous tag
                  prev_tag=$(git describe --tags --abbrev=0 HEAD^ 2>/dev/null || echo "")

                  if [ -n "$prev_tag" ]; then
                    echo "## What's Changed" > CHANGELOG.md
                    echo "" >> CHANGELOG.md
                    git log --pretty=format:"* %s (%h)" $prev_tag..HEAD >> CHANGELOG.md
                  else
                    echo "## Initial Release" > CHANGELOG.md
                    echo "" >> CHANGELOG.md
                    echo "First release of HPE GreenLake MCP Docker containers." >> CHANGELOG.md
                  fi

                  echo "" >> CHANGELOG.md
                  echo "## Container Images" >> CHANGELOG.md
                  echo "" >> CHANGELOG.md
                  echo "Pull from GitHub Container Registry:" >> CHANGELOG.md
                  echo '```bash' >> CHANGELOG.md
                  for service in audit-logs devices subscriptions users workspaces; do
                    echo "docker pull ghcr.io/${{ github.repository_owner }}/glp-mcp-$service:${{ steps.version.outputs.version }}" >> CHANGELOG.md
                  done
                  echo '```' >> CHANGELOG.md

            - name: Create Release
              uses: softprops/action-gh-release@v1
              with:
                  tag_name: ${{ steps.version.outputs.version }}
                  name: Release ${{ steps.version.outputs.version }}
                  body_path: CHANGELOG.md
                  draft: false
                  prerelease: ${{ contains(steps.version.outputs.version, '-') }}
              env:
                  GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
