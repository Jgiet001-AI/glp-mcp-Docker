# =============================================================================
# HPE GreenLake MCP Docker - Security Scanning
# =============================================================================
# Daily security scans of container images and code
#
# Schedule: Daily at 2 AM UTC
# =============================================================================

name: Security Scan

on:
    schedule:
        - cron: "0 2 * * *" # Daily at 2 AM UTC
    workflow_dispatch:

permissions:
    contents: read
    security-events: write

jobs:
    # ---------------------------------------------------------------------------
    # Container Image Scanning
    # ---------------------------------------------------------------------------
    container-scan:
        name: Scan ${{ matrix.service }} Container
        runs-on: ubuntu-latest
        strategy:
            fail-fast: false
            matrix:
                service:
                    - audit-logs
                    - devices
                    - subscriptions
                    - users
                    - workspaces

        steps:
            - name: Checkout
              uses: actions/checkout@v4

            - name: Build image
              run: docker build -t scan-${{ matrix.service }}:latest ./src/${{ matrix.service }}

            - name: Run Trivy vulnerability scanner
              uses: aquasecurity/trivy-action@master
              with:
                  image-ref: scan-${{ matrix.service }}:latest
                  format: "sarif"
                  output: "trivy-${{ matrix.service }}.sarif"
                  severity: "CRITICAL,HIGH,MEDIUM"
                  vuln-type: "os,library"

            - name: Upload scan results
              uses: github/codeql-action/upload-sarif@v3
              with:
                  sarif_file: "trivy-${{ matrix.service }}.sarif"
                  category: "container-${{ matrix.service }}"

    # ---------------------------------------------------------------------------
    # CodeQL Analysis
    # ---------------------------------------------------------------------------
    codeql:
        name: CodeQL Analysis
        runs-on: ubuntu-latest

        steps:
            - name: Checkout
              uses: actions/checkout@v4

            - name: Initialize CodeQL
              uses: github/codeql-action/init@v3
              with:
                  languages: python
                  queries: security-and-quality

            - name: Perform CodeQL Analysis
              uses: github/codeql-action/analyze@v3
              with:
                  category: "codeql-python"

    # ---------------------------------------------------------------------------
    # Secret Scanning
    # ---------------------------------------------------------------------------
    secrets:
        name: Secret Detection
        runs-on: ubuntu-latest

        steps:
            - name: Checkout
              uses: actions/checkout@v4
              with:
                  fetch-depth: 0

            - name: Run Gitleaks
              uses: gitleaks/gitleaks-action@v2
              env:
                  GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
                  GITLEAKS_ENABLE_COMMENTS: false

    # ---------------------------------------------------------------------------
    # Dependency Audit
    # ---------------------------------------------------------------------------
    dependency-audit:
        name: Dependency Audit
        runs-on: ubuntu-latest

        steps:
            - name: Checkout
              uses: actions/checkout@v4

            - name: Set up Python
              uses: actions/setup-python@v5
              with:
                  python-version: "3.11"

            - name: Install safety
              run: pip install safety

            - name: Audit dependencies
              continue-on-error: true
              run: |
                  echo "## Dependency Security Audit" > audit-report.md
                  echo "" >> audit-report.md

                  for service in audit-logs devices subscriptions users workspaces; do
                    echo "### $service" >> audit-report.md
                    if [ -f "src/$service/requirements.txt" ]; then
                      safety check -r "src/$service/requirements.txt" --output text >> audit-report.md 2>&1 || true
                    else
                      echo "Using uv.lock (no requirements.txt)" >> audit-report.md
                    fi
                    echo "" >> audit-report.md
                  done

            - name: Upload audit report
              uses: actions/upload-artifact@v4
              with:
                  name: dependency-audit-report
                  path: audit-report.md

    # ---------------------------------------------------------------------------
    # Summary
    # ---------------------------------------------------------------------------
    summary:
        name: Security Summary
        runs-on: ubuntu-latest
        needs: [container-scan, codeql, secrets, dependency-audit]
        if: always()

        steps:
            - name: Create summary
              run: |
                  echo "## 🔒 Security Scan Summary" >> $GITHUB_STEP_SUMMARY
                  echo "" >> $GITHUB_STEP_SUMMARY
                  echo "| Check | Status |" >> $GITHUB_STEP_SUMMARY
                  echo "|-------|--------|" >> $GITHUB_STEP_SUMMARY
                  echo "| Container Scanning | ${{ needs.container-scan.result }} |" >> $GITHUB_STEP_SUMMARY
                  echo "| CodeQL Analysis | ${{ needs.codeql.result }} |" >> $GITHUB_STEP_SUMMARY
                  echo "| Secret Detection | ${{ needs.secrets.result }} |" >> $GITHUB_STEP_SUMMARY
                  echo "| Dependency Audit | ${{ needs.dependency-audit.result }} |" >> $GITHUB_STEP_SUMMARY
