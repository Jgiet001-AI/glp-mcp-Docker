name: Docker Publish

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
    branches: [main]

env:
  REGISTRY: docker.io

jobs:
  # Security scanning job
  security-scan:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write
    strategy:
      fail-fast: false
      matrix:
        service: [audit-logs, devices, subscriptions, users, workspaces]
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Build image for scanning
        uses: docker/build-push-action@v6
        with:
          context: ./src/${{ matrix.service }}
          push: false
          load: true
          tags: scan-${{ matrix.service }}:latest

      - name: Run Trivy vulnerability scanner
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: scan-${{ matrix.service }}:latest
          format: "sarif"
          output: "trivy-results-${{ matrix.service }}.sarif"
          severity: "CRITICAL,HIGH"
          ignore-unfixed: true

      - name: Upload Trivy scan results to GitHub Security tab
        uses: github/codeql-action/upload-sarif@v3
        if: always()
        with:
          sarif_file: "trivy-results-${{ matrix.service }}.sarif"

      - name: Fail on critical vulnerabilities
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: scan-${{ matrix.service }}:latest
          format: "table"
          exit-code: "1"
          severity: "CRITICAL"
          ignore-unfixed: true

  # Build and push job
  build-and-push:
    needs: security-scan
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
      id-token: write # For SLSA provenance

    strategy:
      fail-fast: false
      matrix:
        service:
          - name: audit-logs
            context: ./src/audit-logs
            image: greenlake-mcp-audit-logs
          - name: devices
            context: ./src/devices
            image: greenlake-mcp-devices
          - name: subscriptions
            context: ./src/subscriptions
            image: greenlake-mcp-subscriptions
          - name: users
            context: ./src/users
            image: greenlake-mcp-users
          - name: workspaces
            context: ./src/workspaces
            image: greenlake-mcp-workspaces

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to Docker Hub
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Extract metadata (tags, labels)
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ secrets.DOCKERHUB_USERNAME }}/${{ matrix.service.image }}
          tags: |
            type=ref,event=branch
            type=ref,event=pr
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=sha,prefix=sha-
            type=raw,value=latest,enable={{is_default_branch}}

      - name: Build and push Docker image
        id: build
        uses: docker/build-push-action@v6
        with:
          context: ${{ matrix.service.context }}
          platforms: linux/amd64,linux/arm64
          push: ${{ github.event_name != 'pull_request' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          provenance: true
          sbom: true

  # License scanning job
  license-scan:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        service: [audit-logs, devices, subscriptions, users, workspaces]
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install uv
        run: pip install uv

      - name: Install dependencies and check licenses
        working-directory: ./src/${{ matrix.service }}
        run: |
          uv sync --frozen --no-dev
          uv pip install pip-licenses
          uv run pip-licenses --format=markdown --fail-on="AGPL-3.0-only;AGPL-3.0-or-later" || exit 1

  # Summary job
  publish-summary:
    needs: [build-and-push, license-scan]
    runs-on: ubuntu-latest
    if: github.event_name != 'pull_request'
    steps:
      - name: Summary
        run: |
          echo "## Docker Images Published" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "### Security Checks Passed" >> $GITHUB_STEP_SUMMARY
          echo "- No critical/high vulnerabilities (Trivy)" >> $GITHUB_STEP_SUMMARY
          echo "- No AGPL v3 licenses detected" >> $GITHUB_STEP_SUMMARY
          echo "- SBOM and provenance attestation attached" >> $GITHUB_STEP_SUMMARY
          echo "- Non-root user configured" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "### Images" >> $GITHUB_STEP_SUMMARY
          echo "| Service | Image |" >> $GITHUB_STEP_SUMMARY
          echo "|---------|-------|" >> $GITHUB_STEP_SUMMARY
          echo "| audit-logs | \`${{ secrets.DOCKERHUB_USERNAME }}/greenlake-mcp-audit-logs\` |" >> $GITHUB_STEP_SUMMARY
          echo "| devices | \`${{ secrets.DOCKERHUB_USERNAME }}/greenlake-mcp-devices\` |" >> $GITHUB_STEP_SUMMARY
          echo "| subscriptions | \`${{ secrets.DOCKERHUB_USERNAME }}/greenlake-mcp-subscriptions\` |" >> $GITHUB_STEP_SUMMARY
          echo "| users | \`${{ secrets.DOCKERHUB_USERNAME }}/greenlake-mcp-users\` |" >> $GITHUB_STEP_SUMMARY
          echo "| workspaces | \`${{ secrets.DOCKERHUB_USERNAME }}/greenlake-mcp-workspaces\` |" >> $GITHUB_STEP_SUMMARY
